{% extends "base.html" %}
{% block title %}Onboarding — Step 1{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <!-- Progress -->
    <div class="d-flex align-items-center gap-2 mb-4">
      <div class="flex-grow-1" style="height:4px;border-radius:2px;background:var(--pw-primary);"></div>
      <div class="flex-grow-1" style="height:4px;border-radius:2px;background:#e5e7eb;"></div>
      <div class="flex-grow-1" style="height:4px;border-radius:2px;background:#e5e7eb;"></div>
      <span class="text-muted small ms-2">1 / 3</span>
    </div>

    <h3 class="fw-bold mb-1" style="letter-spacing:-0.5px;">What brings you here?</h3>
    <p class="text-muted small mb-4">This helps us match you with the right peers.</p>

    <form method="post" id="step1-form">
      {% csrf_token %}
      <div class="d-flex flex-column gap-2 mb-4" id="intent-options">
        {% for radio in form.intent %}
        <button type="button" class="onb-option-btn" data-value="{{ radio.data.value }}">
          <span class="onb-icon">
            {% if radio.data.value == "learn" %}
              <i class="bi bi-book"></i>
            {% elif radio.data.value == "build" %}
              <i class="bi bi-hammer"></i>
            {% elif radio.data.value == "collaborate" %}
              <i class="bi bi-people"></i>
            {% elif radio.data.value == "explore" %}
              <i class="bi bi-compass"></i>
            {% endif %}
          </span>
          <span class="fw-semibold">{{ radio.choice_label }}</span>
        </button>
        {% endfor %}
      </div>
      <!-- Hidden real input -->
      <input type="hidden" name="intent" id="intent-input" value="">
      <button type="submit" class="btn btn-pw w-100" id="continue-btn" disabled>Continue</button>
    </form>
  </div>
</div>

<style>
.onb-option-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  border: 2px solid #e5e7eb;
  border-radius: 12px;
  background: #fff;
  padding: 16px 20px;
  cursor: pointer;
  transition: all 0.15s ease;
  text-align: left;
  font-size: 0.95rem;
}
.onb-option-btn:hover {
  border-color: var(--pw-primary);
  background: #f8f9ff;
}
.onb-option-btn.selected {
  border-color: var(--pw-primary);
  background: #eef2ff;
  box-shadow: 0 0 0 1px var(--pw-primary);
}
.onb-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: #f3f4f6;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  color: var(--pw-primary);
  flex-shrink: 0;
}
.onb-option-btn.selected .onb-icon {
  background: var(--pw-primary);
  color: #fff;
}
</style>

<script>
(function() {
  const btns = document.querySelectorAll('#intent-options .onb-option-btn');
  const hidden = document.getElementById('intent-input');
  const submit = document.getElementById('continue-btn');
  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      btns.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      hidden.value = btn.dataset.value;
      submit.disabled = false;
    });
  });
})();
</script>
{% endblock %}
